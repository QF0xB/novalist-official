<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The CI typefaces. This page sits outside the bundler's module graph, so it
     links the vendored sheet directly; without it the host's chosen prose face
     would not resolve inside the frame. -->
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="editor-motion.css">
<link rel="stylesheet" href="writing-zoom.css">
</head>
<body>
<div id="editor-wrapper">
    <div id="editor" contenteditable="true" spellcheck="false" lang="en"></div>
</div>
<div id="grammar-status-bar" class="grammar-status-bar">
    <div class="status-throbber" id="status-throbber">
        <svg class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
        </svg>
    </div>
    <div class="status-check-done" id="status-check-done" title="Check completed: no issues found">
        <svg viewBox="0 0 24 24" width="14" height="14">
            <path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
    </div>
    <div class="status-divider"></div>
    <div class="status-item" id="status-grammar-count-container" title="Grammar & style issues (Click to find next)">
        <span class="status-icon grammar-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
        </span>
        <span class="status-count" id="status-grammar-count">0</span>
    </div>
    <div class="status-item" id="status-punctuation-count-container" title="Spelling & typography issues (Click to find next)">
        <span class="status-icon spelling-icon">
            <svg viewBox="0 0 24 24" width="14" height="14">
                <path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/>
            </svg>
        </span>
        <span class="status-count" id="status-punctuation-count">0</span>
    </div>
</div>
<div id="grammar-popup">
    <div class="gp-message"></div>
    <div class="gp-suggestions"></div>
    <div class="gp-dismiss">Dismiss</div>
</div>
<div id="context-menu"></div>
<!-- placement-container: selectionToolbar -->
<div id="floating-toolbar">
    <button id="ft-bold" title="Bold" data-command="text.bold"><b>B</b></button>
    <button id="ft-italic" title="Italic (Ctrl+I)" data-command="text.italic"><i>I</i></button>
    <button id="ft-underline" title="Underline (Ctrl+U)" style="text-decoration:underline" data-command="text.underline">U</button>
    <button id="ft-strike" title="Strikethrough" style="text-decoration:line-through" data-command="text.strikethrough">S</button>
    <button id="ft-highlight" title="Highlight" data-command="text.highlight">H</button>
    <button id="ft-link" title="Link" data-command="text.link">Link</button>
    <div class="ft-sep"></div>
    <!-- Alignment used to sit here too. It acts on the paragraph the caret is
         in, not on what is selected, so a bar that only appears once you have
         dragged across a word taught that alignment was something you did to
         selected text. It lives on the editor toolbar, which is always there. -->
    <button id="ft-comment" title="Add comment" aria-label="Add comment" data-command="text.comment">Comment</button>
    <button id="ft-footnote" title="Add footnote" aria-label="Add footnote" data-command="text.footnote">Footnote</button>
</div>
<!-- placement-container: end -->
<div id="mention-picker" tabindex="-1"></div>
<script src="purify.min.js"></script>
<script src="scene-html.js"></script>
<script src="dialogue-correction.js"></script>
<script src="editor-runtime.js"></script>
<script src="readability.js"></script>
<script src="read-aloud.js"></script>
<script src="editor-content.js"></script>
<script src="formatting.js"></script>
<script src="typography.js"></script>
<script src="entity-matching.js"></script>
<script src="page-layout.js"></script>
<script src="typewriter-scroll.js"></script>
<script src="mentions.js"></script>
<script src="entity-hit-testing.js"></script>
<script src="quote-context.js"></script>
<script src="auto-replacements.js"></script>
<script src="dialogue-input.js"></script>
<script src="content-input.js"></script>
<script src="comment-gutter.js"></script>
<script src="clipboard-focus.js"></script>
<script src="context-menu-actions.js"></script>
<script src="context-menu-rendering.js"></script>
<script src="grammar-highlights.js"></script>
<script src="grammar-corrections.js"></script>
<script src="proofing-toolbar.js"></script>
<script src="annotations.js"></script>
<script src="suggestions.js"></script>
<script src="inline-actions.js"></script>
<script src="completion.js"></script>
<script src="slash-commands.js"></script>
<script src="dictation.js"></script>
<script src="editor-state.js"></script>
<script src="layout-events.js"></script>
<script src="typing-events.js"></script>
<script src="comment-gutter-events.js"></script>
<script src="entity-events.js"></script>
<script src="clipboard-focus-events.js"></script>
<script src="context-menu-events.js"></script>
<script src="grammar-events.js"></script>
<script src="selection-toolbar-events.js"></script>
<script src="comment-bridge.js"></script>
<script src="footnote-bridge.js"></script>
<script src="spelling-bridge.js"></script>
<script src="footnote-navigation.js"></script>
<script src="suggestion-events.js"></script>
<script src="inline-action-state.js"></script>
<script src="dictation-bridge.js"></script>
<script src="writing-zoom.js"></script>
<script src="editor-ready.js"></script>
</body>
</html>
